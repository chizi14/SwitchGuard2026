services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switchguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-switchguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-switchguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-switchguard} -d ${POSTGRES_DB:-switchguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      REVERSAL_AUTO_THRESHOLD_MWK: ${REVERSAL_AUTO_THRESHOLD_MWK:-100000}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    # Dokploy Traefik labels — exposes the API at /api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.switchguard-api.rule=Host(`switchguard.YOUR_DOMAIN.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.switchguard-api.entrypoints=websecure"
      - "traefik.http.routers.switchguard-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.switchguard-api.loadbalancer.server.port=8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Dokploy Traefik labels — serves frontend on root domain
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.switchguard-web.rule=Host(`switchguard.YOUR_DOMAIN.com`)"
      - "traefik.http.routers.switchguard-web.entrypoints=websecure"
      - "traefik.http.routers.switchguard-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.switchguard-web.loadbalancer.server.port=5173"

volumes:
  pgdata:
