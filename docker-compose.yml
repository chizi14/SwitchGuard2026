services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switchguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-switchguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-switchguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-switchguard} -d ${POSTGRES_DB:-switchguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./Backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      REVERSAL_AUTO_THRESHOLD_MWK: ${REVERSAL_AUTO_THRESHOLD_MWK:-100000}
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "80:5173"
    depends_on:
      - backend

volumes:
  pgdata:
